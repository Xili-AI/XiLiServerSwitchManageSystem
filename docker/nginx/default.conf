# Panel and SPA. Service routes are generated into /etc/nginx/dynamic/.
server {
    listen 80 default_server;
    server_name _;

    # The public entry can be a non-standard port (e.g. frp-fog.com:27294).
    # Nginx only knows 127.0.0.1:80, so absolute redirects would drop the public
    # scheme/port. Relative Location headers keep the browser on the same origin.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS is required for variable-based proxy_pass in path mode.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Re-route root-absolute subresources (script/style/image/font/fetch) coming
    # from a path-mounted service, e.g. "/static/app.js" loaded from "/p/app/".
    # Requests already under /p/ are skipped, so the rewrite cannot loop. This
    # runs before location matching, so /api/ and /assets/ cannot shadow a
    # service's own paths. Documents are excluded by the map: /login and every
    # other navigation must reach the panel, never a service.
    if ($svc_referer_prefix != "") {
        rewrite ^(?!/p/) $svc_referer_prefix$uri last;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket tunnel (wstunnel). The first path segment is TUNNEL_SECRET;
    # wstunnel itself rejects any other prefix, so this location only has to
    # recognise the 32-hex token shape. Keep the URI intact: wstunnel expects
    # /<secret>/... and does its own path parsing.
    location ~ "^/[0-9a-f]{32}(/.*)?$" {
        set $tunnel_upstream tunnel:8080;
        proxy_pass http://$tunnel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_socket_keepalive on;
    }

    # Generated path-mode locations (priority over the SPA fallback).
    include /etc/nginx/dynamic/paths.conf;

    # Unknown /p/* must never fall through to the panel SPA. Doing so used to
    # load the console inside a service URL; its relative requests then broke
    # and every model of failure looked the same. 404 is honest and safe.
    location ^~ /p/ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # Revalidate the SPA shell so a host that later becomes a service route
    # cannot keep serving a cached console page.
    # Panel security headers live here (not at server level) so they are not
    # inherited by proxied service responses under /p/<slug>/.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src *; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        expires -1;
    }

    # /egg must end with a slash so relative image URLs resolve inside it.
    location = /egg {
        return 308 /egg/;
    }

    # Static easter egg, part of the console build (public/egg).
    location ^~ /egg/ {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src *; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        try_files $uri $uri/ @spa;
    }

    # A missing subresource must fail as 404, not as the SPA shell with
    # 200/text-html. Returning HTML for *.js/css/png is what turned one wrong
    # prefix into a wall of MIME-type errors that hid the real cause.
    location @spa {
        if ($http_sec_fetch_dest ~ ^(script|style|image|font|audio|video|track|manifest|empty)$) {
            return 404;
        }
        try_files /index.html =404;
    }
}
