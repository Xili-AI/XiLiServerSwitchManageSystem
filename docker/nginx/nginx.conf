user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 500m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Path-mode compatibility: services mounted under /p/<slug>/ frequently emit
    # root-absolute URLs ("/static/app.js", "/api/..."). Subresource requests
    # carrying a Referer inside a path route are re-prefixed so they reach the
    # same service.
    #
    # Only subresources are eligible. Document navigations are excluded so a
    # request such as /login always reaches the panel and can never be captured
    # by whichever service the previous page belonged to. Non-browser clients
    # usually omit Sec-Fetch-Dest, which disables the heuristic for them.
    map $http_sec_fetch_dest $svc_referer_dest_ok {
        default            0;
        script             1;
        style              1;
        image              1;
        font               1;
        audio              1;
        video              1;
        track              1;
        manifest           1;
        empty              1;
    }

    map $http_referer $svc_referer_path {
        ~^(?:https?://[^/]+)?(/p/[^/?#]+)/  $1;
        default                              "";
    }

    map "$svc_referer_dest_ok:$svc_referer_path" $svc_referer_prefix {
        ~^1:(/p/[^/]+)$  $1;
        default          "";
    }

    include /etc/nginx/conf.d/*.conf;
}
