<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>XILI · 彩蛋</title>
<style>
  :root {
    --cyan: #5fd3f3;
    --violet: #7c5cff;
    --ink: #05070f;
    --text: #cfe3ff;
    --muted: #6b86b5;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(900px 520px at 50% 18%, rgba(58, 110, 216, 0.24), transparent 66%),
      radial-gradient(700px 420px at 50% 84%, rgba(124, 92, 255, 0.12), transparent 70%),
      var(--ink);
    color: var(--text);
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      repeating-linear-gradient(0deg, rgba(95, 211, 243, 0.05) 0 1px, transparent 1px 44px),
      repeating-linear-gradient(90deg, rgba(95, 211, 243, 0.05) 0 1px, transparent 1px 44px);
    mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 74%);
  }

  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 20px 44px;
    text-align: center;
  }

  /* ============ 3D CPU chip (pure CSS, adapted from XiliProfile) ============ */
  .xl-chip-stage {
    --cw: 240px;
    --ct: 26px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
    padding: 40px 0 26px;
    min-height: 360px;
  }

  .xl-cpu-glow {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 470px;
    height: 470px;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle, rgba(95, 211, 243, 0.26) 0%, rgba(58, 110, 216, 0.14) 42%, rgba(0, 0, 0, 0) 70%);
    animation: xl-cpu-glow 3.6s ease-in-out infinite;
  }

  @keyframes xl-cpu-glow {
    0%, 100% { opacity: 0.42; transform: translate(-50%, -50%) scale(0.9); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  }

  .xl-cpu-tilt {
    position: relative;
    width: var(--cw);
    height: var(--cw);
    transform-style: preserve-3d;
    animation: xl-cpu-float 10s ease-in-out infinite;
  }

  @keyframes xl-cpu-float {
    0%, 100% { transform: rotateX(34deg) rotateZ(-14deg); }
    50% { transform: rotateX(27deg) rotateZ(-5deg) translateZ(16px); }
  }

  .xl-cpu {
    position: relative;
    width: var(--cw);
    height: var(--cw);
    transform-style: preserve-3d;
  }

  .xl-cpu-top {
    position: absolute;
    inset: 0;
    transform: translateZ(var(--ct));
    background: linear-gradient(140deg, #24395f 0%, #10203e 52%, #0a1428 100%);
    border: 2px solid #3d5c96;
    border-radius: 7px;
    box-shadow: inset 0 0 40px rgba(95, 211, 243, 0.16);
  }

  .xl-cpu-top::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 5px;
    pointer-events: none;
    background: linear-gradient(140deg, rgba(190, 248, 255, 0.38), rgba(124, 92, 255, 0.24));
    animation: xl-face-pulse 3.6s ease-in-out infinite;
  }

  @keyframes xl-face-pulse {
    0%, 100% { opacity: 0.1; }
    50% { opacity: 0.62; }
  }

  .xl-cpu-face { position: absolute; overflow: hidden; }

  .xl-cpu-face::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: rgba(190, 248, 255, 0.5);
    animation: xl-face-pulse 3.6s ease-in-out infinite;
  }

  .xl-cpu-front {
    left: 0;
    top: var(--cw);
    width: var(--cw);
    height: var(--ct);
    transform-origin: top center;
    transform: translateZ(var(--ct)) rotateX(-90deg);
    background: linear-gradient(180deg, #2a4a80, #0a1428);
    border: 1px solid #3a5b93;
    border-top: none;
  }

  .xl-cpu-right {
    left: var(--cw);
    top: 0;
    width: var(--ct);
    height: var(--cw);
    transform-origin: left center;
    transform: translateZ(var(--ct)) rotateY(90deg);
    background: linear-gradient(90deg, #1d3358, #0a1428);
    border: 1px solid #2f4d80;
    border-left: none;
  }

  .xl-cpu-pins {
    position: absolute;
    opacity: 0.9;
    background-image: repeating-linear-gradient(90deg, #e8c96a 0 7px, rgba(232, 201, 106, 0) 7px 16px);
  }

  .xl-cpu-pins.pt { left: 14px; right: 14px; top: -13px; height: 11px; }
  .xl-cpu-pins.pb { left: 14px; right: 14px; bottom: -13px; height: 11px; }
  .xl-cpu-pins.pl {
    top: 14px; bottom: 14px; left: -13px; width: 11px;
    background-image: repeating-linear-gradient(0deg, #e8c96a 0 7px, rgba(232, 201, 106, 0) 7px 16px);
  }
  .xl-cpu-pins.pr {
    top: 14px; bottom: 14px; right: -13px; width: 11px;
    background-image: repeating-linear-gradient(0deg, #e8c96a 0 7px, rgba(232, 201, 106, 0) 7px 16px);
  }

  .xl-cpu-die {
    position: absolute;
    inset: 20px 20px 54px;
    border-radius: 4px;
    overflow: hidden;
    background:
      repeating-linear-gradient(0deg, rgba(95, 211, 243, 0.09) 0 1px, rgba(0, 0, 0, 0) 1px 13px),
      repeating-linear-gradient(90deg, rgba(95, 211, 243, 0.09) 0 1px, rgba(0, 0, 0, 0) 1px 13px),
      radial-gradient(circle at 46% 40%, rgba(58, 140, 216, 0.45), rgba(5, 10, 22, 0.94) 74%);
    border: 1px solid rgba(95, 211, 243, 0.5);
    box-shadow: inset 0 0 36px rgba(95, 211, 243, 0.32);
  }

  .xl-cpu-die::before {
    content: "";
    position: absolute;
    inset: -60%;
    pointer-events: none;
    background: linear-gradient(104deg, rgba(0, 0, 0, 0) 44%, rgba(190, 248, 255, 0.55) 50%, rgba(0, 0, 0, 0) 56%);
    animation: xl-current 3.6s linear infinite;
  }

  .xl-cpu-die::after {
    content: "";
    position: absolute;
    inset: -60%;
    pointer-events: none;
    background: linear-gradient(104deg, rgba(0, 0, 0, 0) 28%, rgba(124, 92, 255, 0.45) 34%, rgba(0, 0, 0, 0) 40%);
    animation: xl-current 3.6s linear infinite;
  }

  @keyframes xl-current {
    0% { transform: translate(-40%, -40%); }
    100% { transform: translate(40%, 40%); }
  }

  .xl-cpu-die img {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    image-rendering: pixelated;
    animation: xl-die-core 3.6s ease-in-out infinite;
  }

  @keyframes xl-die-core {
    0%, 100% { opacity: 0.72; }
    50% { opacity: 1; }
  }

  .xl-spark {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #e8fdff;
    box-shadow: 0 0 9px 2px rgba(95, 211, 243, 0.95);
    opacity: 0;
    animation: xl-spark 3.6s linear infinite;
    animation-delay: calc(var(--i) * -0.42s);
  }

  @keyframes xl-spark {
    0% { opacity: 0; transform: translate(0, 0) scale(0.4); }
    10% { opacity: 1; }
    55% { opacity: 1; transform: translate(var(--dx), var(--dy)) scale(1); }
    90% { opacity: 0.65; transform: translate(calc(var(--dx) * 1.35), calc(var(--dy) * 1.35)) scale(0.85); }
    100% { opacity: 0; transform: translate(calc(var(--dx) * 1.6), calc(var(--dy) * 1.6)) scale(0.5); }
  }

  .xl-cpu-mark {
    position: absolute;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    width: 130px;
    opacity: 1;
  }

  .xl-cpu-wave {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--cw);
    height: var(--cw);
    border: 2px solid rgba(95, 211, 243, 0.7);
    border-radius: 9px;
    pointer-events: none;
    animation: xl-wave 3.6s ease-out infinite;
  }

  @keyframes xl-wave {
    0% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    68% { opacity: 0; transform: translate(-50%, -50%) scale(1.85); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.85); }
  }

  /* ============ page copy ============ */
  .caption {
    position: relative;
    z-index: 2;
    margin-top: 6px;
  }

  .caption h1 {
    margin: 0 0 10px;
    font-size: clamp(18px, 3.4vw, 26px);
    letter-spacing: 0.28em;
    font-weight: 600;
    color: #eaf6ff;
    text-shadow: 0 0 22px rgba(95, 211, 243, 0.45);
  }

  .caption p {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.34em;
    color: var(--muted);
  }

  .caption .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 8px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px rgba(95, 211, 243, 0.9);
    animation: xl-blink 1.6s steps(1) infinite;
  }

  @keyframes xl-blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.15; }
  }

  @media (max-width: 560px) {
    .xl-chip-stage {
      --cw: 190px;
      --ct: 21px;
      min-height: 300px;
      padding: 28px 0 20px;
    }
    .xl-cpu-glow { width: 360px; height: 360px; }
    .xl-cpu-die img { width: 78px; }
    .xl-cpu-mark { width: 100px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .xl-cpu-tilt,
    .xl-cpu-glow,
    .xl-cpu-top::after,
    .xl-cpu-face::after,
    .xl-cpu-wave,
    .xl-cpu-die::before,
    .xl-cpu-die::after,
    .xl-cpu-die img,
    .xl-spark,
    .caption .dot {
      animation: none !important;
    }
  }
</style>
</head>
